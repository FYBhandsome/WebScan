<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>CodeGuard AST审计智能体</title>
    <style>
        * {margin: 0;padding: 0;box-sizing: border-box;font-family: system-ui;}
        body {padding: 20px;background: #f5f7fa;}
        .container {max-width: 1200px;margin: 0 auto;}
        .card {background: white;padding: 20px;border-radius: 10px;box-shadow: 0 2px 10px #0001;}
        .btn {padding: 10px 20px;background: #2563eb;color: white;border: none;border-radius: 6px;cursor: pointer;}
        .btn:disabled {background: #94a3b8;}
        .vuln {padding: 10px;margin: 10px 0;border-left: 4px solid;border-radius: 6px;}
        .high {border-color: #ef4444;background: #fef2f2;}
        .medium {border-color: #f59e0b;background: #fffbeb;}
        .diff {margin-top: 20px;border: 1px solid #e5e7eb;padding: 10px;border-radius: 6px;}
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h2>AST代码审计智能体</h2>
        <br>
        <input type="file" id="file" accept=".py">
        <button class="btn" id="startBtn">开始审计</button>
        <div id="loading" style="display:none;color:#2563eb;margin-top:10px;">审计中...</div>
    </div>

    <div class="card" style="margin-top:20px;display:none;" id="resultBox">
        <h3>审计结果</h3>
        <div id="vulnList"></div>
        <div class="diff" id="diffBox"></div>
    </div>
</div>

<script>
    const startBtn = document.getElementById('startBtn');
    const fileInput = document.getElementById('file');
    const resultBox = document.getElementById('resultBox');
    const vulnList = document.getElementById('vulnList');
    const diffBox = document.getElementById('diffBox');
    const loading = document.getElementById('loading');

    startBtn.onclick = async () => {
        const file = fileInput.files[0];
        if (!file) { alert('请选择Python文件'); return; }

        startBtn.disabled = true;
        loading.style.display = 'block';
        resultBox.style.display = 'none';

        const form = new FormData();
        form.append('file', file);

        try {
            const res = await fetch('/upload', { method: 'POST', body: form });
            const data = await res.json();
            if (data.code !== 200) { alert(data.msg); return; }

            const taskId = data.data.task_id;
            const result = await fetch(`/result/${taskId}`);
            const resultData = await result.json();

            showResult(resultData.data);
        } catch (e) { alert('请求失败'); } finally {
            startBtn.disabled = false;
            loading.style.display = 'none';
        }
    };

    function showResult(data) {
        resultBox.style.display = 'block';
        vulnList.innerHTML = '';

        data.vulns.forEach(v => {
            const cls = v.level === 'HIGH' ? 'high' : 'medium';
            vulnList.innerHTML += `
                <div class="vuln ${cls}">
                    <h4>${v.type} | ${v.level === 'HIGH' ? '高危' : '中危'}</h4>
                    <p>行号：${v.line}</p>
                    <p>代码：<code>${v.code}</code></p>
                    <p>描述：${v.desc}</p>
                </div>
            `;
        });

        if (data.diff_html) {
            diffBox.innerHTML = `<h4>代码标准化差异对比</h4>${data.diff_html}`;
        }
    }
</script>
</body>
</html>
