[metadata]
name = toskill
version = 1.0.0
description = TOSKill - AI驱动的Web安全扫描服务
author = TOSKill Team
author_email = toskill@example.com
license = MIT
python_requires = >=3.9
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Security
    Topic :: Software Development :: Testing

[options]
packages = find:
include_package_data = true
install_requires =
    fastapi>=0.100.0
    uvicorn>=0.23.0
    pydantic>=2.0.0
    pydantic-settings>=2.0.0
    langchain>=0.1.0
    langchain-openai>=0.1.0
    langgraph>=0.0.20
    requests>=2.28.0
    python-multipart>=0.0.6
    websockets>=11.0

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    pytest-asyncio>=0.21.0
    pytest-mock>=3.10.0
    httpx>=0.24.0
    black>=23.0.0
    isort>=5.12.0
    flake8>=6.0.0
    mypy>=1.0.0

[options.packages.find]
where = .
include = TOSKill*

[coverage:run]
source = TOSKill
branch = True
omit =
    */tests/*
    */__pycache__/*
    */site-packages/*
    */migrations/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod
show_missing = True
skip_covered = False
precision = 2

[coverage:html]
directory = htmlcov
title = TOSKill Test Coverage Report

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json
pretty_print = True

[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info,
    migrations
ignore =
    E203,
    E501,
    W503,
    W504

[isort]
profile = black
line_length = 120
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip_gitignore = True
known_first_party = TOSKill
sections = FUTURE,STDLIB,THIRDPARTY,FIRSTPARTY,LOCALFOLDER

[mypy]
python_version = 3.9
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
ignore_missing_imports = True

[mypy-TOSKill.*]
disallow_untyped_defs = False

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
