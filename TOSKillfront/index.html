<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOSKill Security Scanner</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo">
                <span class="logo-icon">🛡️</span>
                <span class="logo-text">TOSKill Security Scanner</span>
            </div>
            <div class="header-status">
                <span class="status-indicator" id="connectionStatus"></span>
                <span class="status-text" id="connectionText">未连接</span>
            </div>
        </header>

        <div class="app-body">
            <nav class="sidebar">
                <div class="nav-item active" data-page="console">
                    <span class="nav-icon">💬</span>
                    <span class="nav-text">控制台</span>
                </div>
                <div class="nav-item" data-page="scan">
                    <span class="nav-icon">🔍</span>
                    <span class="nav-text">扫描</span>
                </div>
                <div class="nav-item" data-page="tools">
                    <span class="nav-icon">🔧</span>
                    <span class="nav-text">工具</span>
                </div>
                <div class="nav-item" data-page="reports">
                    <span class="nav-icon">📄</span>
                    <span class="nav-text">报告</span>
                </div>
                <div class="nav-item" data-page="settings">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">设置</span>
                </div>
            </nav>

            <main class="main-content">
                <div id="page-console" class="page active">
                    <div class="chat-container">
                        <div class="chat-messages" id="chatMessages">
                            <div class="welcome-message">
                                <div class="welcome-icon">🚀</div>
                                <h2>欢迎使用 TOSKill Security Scanner</h2>
                                <p>AI驱动的Web安全扫描系统，输入目标开始扫描</p>
                            </div>
                        </div>
                        <div class="chat-input-area">
                            <div class="quick-actions" id="quickActions">
                                <button class="quick-btn" data-action="info">信息收集</button>
                                <button class="quick-btn" data-action="vuln">漏洞扫描</button>
                                <button class="quick-btn" data-action="full">完整扫描</button>
                            </div>
                            <div class="input-wrapper">
                                <input type="text" id="chatInput" placeholder="输入目标URL或消息..." autocomplete="off">
                                <button id="sendBtn" class="send-btn">
                                    <span>发送</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="page-scan" class="page">
                    <div class="page-header">
                        <h2>扫描任务</h2>
                    </div>
                    <div class="scan-form">
                        <div class="form-group">
                            <label>扫描目标</label>
                            <input type="text" id="scanTarget" placeholder="例如: example.com 或 https://example.com">
                        </div>
                        <div class="form-group">
                            <label>扫描模式</label>
                            <select id="scanMode">
                                <option value="info">信息收集</option>
                                <option value="vuln">漏洞扫描</option>
                                <option value="full">完整扫描</option>
                            </select>
                        </div>
                        <button id="startScanBtn" class="primary-btn">开始扫描</button>
                    </div>
                    <div class="scan-progress" id="scanProgress" style="display: none;">
                        <div class="progress-header">
                            <span class="progress-title">扫描进度</span>
                            <span class="progress-status" id="progressStatus">准备中...</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="task-list" id="taskList"></div>
                    </div>
                    <div class="scan-results" id="scanResults" style="display: none;">
                        <h3>扫描结果</h3>
                        <div class="results-content" id="resultsContent"></div>
                    </div>
                </div>

                <div id="page-tools" class="page">
                    <div class="page-header">
                        <h2>安全工具</h2>
                    </div>
                    <div class="tools-filter">
                        <button class="filter-btn active" data-category="all">全部</button>
                        <button class="filter-btn" data-category="info">信息收集</button>
                        <button class="filter-btn" data-category="vuln">漏洞扫描</button>
                    </div>
                    <div class="tools-grid" id="toolsGrid"></div>
                    <div class="tool-execution" id="toolExecution" style="display: none;">
                        <div class="execution-header">
                            <h3 id="executionTitle">工具执行</h3>
                            <button class="close-btn" id="closeExecution">×</button>
                        </div>
                        <div class="execution-form">
                            <input type="text" id="toolTarget" placeholder="输入目标">
                            <button id="executeToolBtn" class="primary-btn">执行</button>
                        </div>
                        <div class="execution-result" id="executionResult"></div>
                    </div>
                </div>

                <div id="page-reports" class="page">
                    <div class="page-header">
                        <h2>扫描报告</h2>
                        <button id="refreshReports" class="secondary-btn">刷新</button>
                    </div>
                    <div class="reports-list" id="reportsList">
                        <div class="loading">加载中...</div>
                    </div>
                    <div class="report-viewer" id="reportViewer" style="display: none;">
                        <div class="viewer-header">
                            <h3 id="reportTitle">报告详情</h3>
                            <div class="viewer-actions">
                                <button id="downloadReport" class="secondary-btn">下载</button>
                                <button id="closeViewer" class="close-btn">×</button>
                            </div>
                        </div>
                        <div class="viewer-content" id="viewerContent"></div>
                    </div>
                </div>

                <div id="page-settings" class="page">
                    <div class="page-header">
                        <h2>系统设置</h2>
                    </div>
                    <div class="settings-form">
                        <div class="form-group">
                            <label>API 地址</label>
                            <input type="text" id="apiUrl" value="http://localhost:8081">
                        </div>
                        <div class="form-group">
                            <label>WebSocket 地址</label>
                            <input type="text" id="wsUrl" value="ws://localhost:8081">
                        </div>
                        <div class="form-group">
                            <label>扫描超时 (秒)</label>
                            <input type="number" id="scanTimeout" value="300">
                        </div>
                        <button id="saveSettings" class="primary-btn">保存设置</button>
                        <button id="testConnection" class="secondary-btn">测试连接</button>
                    </div>
                    <div class="connection-status" id="connectionTest"></div>
                </div>
            </main>
        </div>

        <footer class="app-footer">
            <div class="target-bar">
                <span class="target-label">当前目标:</span>
                <span class="target-value" id="currentTarget">未设置</span>
            </div>
        </footer>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">确认操作</span>
                <span class="modal-close" id="modalClose">×</span>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="modal-btn cancel" id="modalCancel">取消</button>
                <button class="modal-btn confirm" id="modalConfirm">确认</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/api.js"></script>
    <script src="js/websocket.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/tools.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
